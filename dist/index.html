<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聆聽課程｜古典音樂 24 週 · 台灣傳統音樂 8 單元</title>
<meta name="description" content="兩門互相對照的聆聽課程：古典音樂 24 週、台灣傳統音樂 8 單元。每首曲目附版本推薦與 KKBOX／YouTube 雙連結。">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f7f5f1; --bg2:#fffdfa; --fg:#22201d; --mut:#6d6760; --line:#e2ddd4;
  --acc:#8a5a2b; --acc2:#b8813f; --sel:#f0e6d6;
  --hires:#1c6b52; --hiresBg:#dff0e8; --hifi:#2f5d8a; --hifiBg:#dde9f4;
  --hist:#7a5b2e; --histBg:#f0e6d2;
  --t-shi:#2f5d8a; --t-xi:#6b4a86; --t-xuan:#8a5a2b;
  --yt:#a8332c; --yt2:#c2453d; --life:#6b5a2e; --lifeBg:#f3ecdb;
  --sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.15);
  --r:12px;
}
[data-theme="dark"]{
  --bg:#16151a; --bg2:#1e1d23; --fg:#e9e6e1; --mut:#9c968e; --line:#33313a;
  --acc:#d6a35f; --acc2:#e0b878; --sel:#2b2731;
  --hires:#6fd3ac; --hiresBg:#16342a; --hifi:#8bbde8; --hifiBg:#1a2c3d;
  --hist:#d3ae70; --histBg:#332a1a;
  --t-shi:#8bbde8; --t-xi:#c3a5e0; --t-xuan:#d6a35f;
  --yt:#d4574e; --yt2:#e06d64; --life:#d8c07f; --lifeBg:#2e2a1e;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.75;font-size:15.5px;-webkit-font-smoothing:antialiased;
}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--sel);padding:.1em .4em;border-radius:5px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1440px;margin:0 auto}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 60px;
  border-right:1px solid var(--line);background:var(--bg2);
}
.main{padding:24px 30px 100px;min-width:0}

/* ---------- header ---------- */
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-bottom:2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 0 12px;margin:-24px 0 20px;background:linear-gradient(var(--bg) 78%,transparent);
  backdrop-filter:blur(6px);
}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
}
/* 焦點框由 .search:focus-within 顯示在整個膠囊上（見「鍵盤焦點」一節） */
/* min-width:0 是必要的：flex 項目預設 min-width:auto，input 又有預設的
   intrinsic 寬度（約 20 字元），窄螢幕上會把整個搜尋膠囊撐破，被 ★ 按鈕蓋住。 */
.search input{flex:1;min-width:0;border:none;background:none;color:inherit;font:inherit;outline:none}
.iconbtn{
  border:1px solid var(--line);background:var(--bg2);border-radius:999px;
  /* 不用 transition:.15s（等於 all）——那會讓鍵盤焦點框淡入，Tab 快速切換時明顯落後 */
  padding:7px 13px;font-size:13px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s;
}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.iconbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---------- 課程切換器 ----------
   一次只顯示一門課的單元，側邊欄才不會被兩門課灌爆。 */
.cswitch{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 0 14px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;
  border-radius:7px;font-size:12.5px;font-weight:600;color:var(--mut);
  transition:background-color .15s,color .15s;min-height:40px;line-height:1.25}
.cbtn:hover{color:var(--acc)}
.cbtn.on{background:var(--acc);color:#fff}
.cbtn .ci{font-size:13px}

/* ---------- nav ---------- */
.navmod{margin:16px 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.navmod span{color:var(--acc)}
.navitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 9px;border-radius:8px;font-size:13.5px;color:var(--fg);
  transition:background-color .12s,border-color .12s,color .12s;border:1px solid transparent;
}
.navitem:hover{background:var(--sel)}
.navitem.active{background:var(--sel);border-color:var(--line);font-weight:600}
.navitem .wn{
  flex:none;width:23px;height:23px;border-radius:6px;background:var(--sel);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut);
  font-variant-numeric:tabular-nums;
}
.navitem.active .wn,.navitem.done .wn{background:var(--acc);color:#fff}
.navitem.done .wn::after{content:"✓";font-size:12px}
.navitem.done .wn span{display:none}
.navitem .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- progress ---------- */
.prog{margin:14px 0 4px;font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:99px;background:var(--sel);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.015em}
.card h3{margin:22px 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:3px;height:15px;background:var(--acc);border-radius:2px}
.eyebrow{font-size:12px;color:var(--mut);letter-spacing:.04em;margin-bottom:6px}
.enttl{font-size:13px;color:var(--mut);font-style:italic;margin-bottom:14px}
.flag{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.banner{background:var(--sel);border-left:3px solid var(--acc);padding:11px 15px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}

/* ---------- tier tags ---------- */
.tier{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid;vertical-align:middle;margin-right:6px;line-height:1.6}
.tier.史{color:var(--t-shi);border-color:var(--t-shi)}
.tier.析{color:var(--t-xi);border-color:var(--t-xi)}
.tier.選{color:var(--t-xuan);border-color:var(--t-xuan)}

/* ---------- tables ---------- */
/* 表格橫向捲動。手機上表格一定被切掉，但原本沒有任何提示，
   看起來就像內容不見了——所以可捲動時加上右側漸層與一行提示。 */
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch;position:relative}
/* 不用 background-attachment:local——那會讓漸層跟著內容捲走，
   一滑就不見了。預設的 scroll 才是固定在元素右緣。 */
.tw.scrollable{background:linear-gradient(to left,var(--bg2),rgba(0,0,0,0)) right/26px 100% no-repeat}
.twhint{font-size:11.5px;color:var(--mut);margin:12px 0 -4px;letter-spacing:.02em}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:400px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--sel);font-weight:700;font-size:13px;white-space:nowrap}

/* ---------- works ---------- */
.work{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;background:var(--bg)}
.workhd{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;cursor:pointer;transition:background-color .12s}
.workhd:hover{background:var(--sel)}
.workhd .ttl{flex:1;min-width:0;text-align:left;padding:0}
.workhd .ttl b{font-size:15px;font-weight:650;display:block}
.workhd .ttl em{font-size:12.5px;color:var(--mut);font-style:normal;display:block}
.star{flex:none;font-size:17px;line-height:1;padding:2px 4px;color:var(--line);transition:color .15s}
.star:hover{transform:scale(1.15)}
.star.on{color:var(--acc2)}
.chev{flex:none;color:var(--mut);font-size:12px;transition:transform .2s;padding-top:4px}
.work.open .chev{transform:rotate(90deg)}
.workbd{display:none;padding:0 15px 14px;border-top:1px dashed var(--line)}
.work.open .workbd{display:block}
.meta{font-size:13px;color:var(--mut);margin:10px 0 4px}
.meta b{color:var(--fg)}

/* ---------- versions ---------- */
.vlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.v{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;
   border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg2)}
.v.hires{border-left:3px solid var(--hires)}
.v.hifi{border-left:3px solid var(--hifi)}
.v.historic{border-left:3px solid var(--hist);opacity:.92}
.v.pinned{box-shadow:inset 0 0 0 1px var(--hires)}
.v.yt{border-left:3px solid var(--yt)}
.play.yt{background:var(--yt)}
.play.yt:hover{background:var(--yt2)}
/* .alt = 次要播放平台。用外框樣式而非實心，讓「主要平台」一眼可辨，
   但兩個連結都保持一樣的點擊面積——它不是次等選項，只是預設不是它。 */
.play.alt{background:none;border:1px solid var(--acc);color:var(--acc)}
.play.alt:hover{background:var(--sel);color:var(--acc)}
.play.yt.alt{border-color:var(--yt);color:var(--yt)}
.play.yt.alt:hover{background:var(--sel);color:var(--yt)}
.life{
  font-size:13px;line-height:1.7;margin:10px 0 4px;padding:9px 13px;
  background:var(--lifeBg);border-left:3px solid var(--life);border-radius:0 8px 8px 0;
}
.life>b:first-child{display:block;font-size:11px;letter-spacing:.06em;color:var(--life);margin-bottom:3px}
.wlink{
  font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;
  background:var(--sel);color:var(--acc);white-space:nowrap;
}
.wlink:hover{background:var(--acc);color:#fff}
.pinTag{background:var(--hiresBg);color:var(--hires);font-weight:700}
.qline{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.6;word-break:break-word}
.qline code{font-size:11.5px;background:var(--sel);padding:1px 5px}
.qline.muted{opacity:.6}
.v .p{font-weight:600;font-size:14px}
.v .sub{font-size:12px;color:var(--mut);margin-top:1px}
.v .why{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.6}
.v .acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.qbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;white-space:nowrap}
.qbadge.hires{color:var(--hires);background:var(--hiresBg)}
.qbadge.hifi{color:var(--hifi);background:var(--hifiBg)}
.qbadge.historic{color:var(--hist);background:var(--histBg)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--sel);color:var(--mut);margin-right:4px}
.play{
  display:block;text-align:center;background:var(--acc);color:#fff;font-size:12.5px;font-weight:600;
  /* 透明外框：讓實心與 .alt 外框兩種按鈕的高度完全一致，不會差那 2px */
  padding:6px 14px;border:1px solid transparent;border-radius:7px;white-space:nowrap;
  transition:background-color .15s,color .15s;
}
.play:hover{background:var(--acc2);text-decoration:none;color:#fff}
.copy{border:1px solid var(--line);border-radius:7px;padding:5px 14px;font-size:12px;color:var(--mut);background:var(--bg)}
.copy:hover{border-color:var(--acc);color:var(--acc)}
.copy.ok{border-color:var(--hires);color:var(--hires)}

/* ---------- checklists ---------- */
.chk{list-style:none;padding:0;margin:8px 0;display:grid;gap:7px}
.chk li{font-size:14px;line-height:1.7}
.chk li>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:6px;flex:none;width:15px;height:15px;accent-color:var(--acc);cursor:pointer}
.chk li.must span::before{content:"必做";font-size:10.5px;font-weight:700;background:var(--acc);color:#fff;padding:1px 6px;border-radius:5px;margin-right:7px;vertical-align:2px}
.chk li.dn span{opacity:.5;text-decoration:line-through}

/* ---------- 可摺疊概念區 ---------- */
.theory{border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:14px 0 18px;padding:0 15px}
.theory>summary{
  cursor:pointer;font-size:14px;font-weight:650;padding:11px 0;margin:0 -15px;padding-left:15px;padding-right:15px;
  list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px;
}
.theory>summary::-webkit-details-marker{display:none}
.theory>summary::before{content:"▶";font-size:10px;color:var(--mut);transition:transform .15s}
.theory[open]>summary::before{transform:rotate(90deg)}
.theory>summary .hint{font-weight:400}
/* 窄螢幕上這行提示會擠成第二行，把收起後的區塊撐高一倍；▶ 三角本身已足夠表意 */
@media(max-width:640px){.theory>summary .hint{display:none}}
.theory[open]>summary{border-bottom:1px solid var(--line)}
.theory>*:last-child{margin-bottom:14px}

/* ---------- 摺疊列（fold） ----------
   曲目卡片改為「首選版本＋播放鈕」一律可見，其餘（本週任務、作品背景、
   其他版本、對照表）各自點開。不做全站模式切換——沒有模式狀態要記，
   每張卡片自己就看得出還有什麼可以展開。 */
.fold{border:1px solid var(--line);border-radius:9px;background:var(--bg2);margin:7px 0}
.fold>summary{
  cursor:pointer;font-size:13px;padding:9px 13px;min-height:40px;
  list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mut);
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary b{color:var(--fg);font-weight:650}
.fold>summary .hint{font-size:11.5px}
.fold:hover>summary b{color:var(--acc)}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.foldbd{padding:12px 13px 14px}
.foldbd>*:first-child{margin-top:0}
.foldbd>*:last-child{margin-bottom:0}

/* 本週任務：未完成時用重點色，一眼看得出還有事沒做 */
.fold.f-task{border-color:var(--acc);background:var(--sel)}
.fold.f-task>summary{color:var(--acc)}
.fold.f-task>summary b{color:var(--acc)}
.fold.f-task.done{border-color:var(--line);background:var(--bg2)}
.fold.f-task.done>summary,.fold.f-task.done>summary b{color:var(--mut)}

/* 對照表：虛線外框，與其他摺疊列區隔（劇透區） */
.fold.ans{border-style:dashed}
.fold.ans[open]>summary{border-bottom-style:dashed}
.ans h4{font-size:13.5px;margin:16px 0 0;padding-left:9px;border-left:3px solid var(--acc)}
.ans h4:first-of-type{margin-top:0}
.ans p{font-size:13.5px;line-height:1.85}

/* 版本列裡的「⋯ 搜尋字串與釘選」——進階功能，預設收起 */
.vmore{margin-top:6px}
.vmore>summary{cursor:pointer;font-size:11.5px;color:var(--mut);list-style:none;
  display:inline-flex;align-items:center;min-height:28px}
.vmore>summary::-webkit-details-marker{display:none}
.vmore>summary:hover{color:var(--acc)}
.vmore .rowbtns{margin-top:8px}
.vmore .qline{margin-top:6px}

/* 首選版本：去掉外框，讓它讀起來像卡片本身的一部分而不是清單的第一項 */
.vlist.top{margin:0}
.vlist.top>li{border-left-width:3px;background:var(--bg)}

/* ---------- 鍵盤焦點 ---------- *//* ---------- 鍵盤焦點 ---------- */
/* 原本全檔唯一的 outline 規則是 .search input{outline:none}，等於移除瀏覽器
   預設焦點框而未補回，鍵盤使用者看不見自己在哪裡。用 :focus-visible 讓滑鼠
   點擊不出現焦點框，只有鍵盤操作才顯示。 */
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--acc);outline-offset:2px;border-radius:6px;
}
/* .play 是深色底的主要按鈕，var(--acc) 描邊在上面對比不足，改用雙層描邊 */
.play:focus-visible{outline:2px solid var(--bg2);outline-offset:0;box-shadow:0 0 0 4px var(--acc)}
/* 輸入框本身無邊框，焦點應落在整個搜尋膠囊上 */
.search:focus-within{outline:2px solid var(--acc);outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;
  }
}

/* ---------- 樂器線稿 ----------
   手繪 SVG，用 currentColor 描邊所以深色模式自動跟著變；
   .hl 是「辨識關鍵」的填色（喇叭口、圓音箱、橫抱的琴身…）。 */
.instfig svg{width:100%;height:100%;display:block;
  fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.instfig .hl{fill:var(--sel);stroke:var(--acc);stroke-width:2.4}
.instfig circle:not(.hl){fill:var(--bg)}

.instgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin:14px 0}
.instcard{display:flex;gap:14px;align-items:flex-start;
  border:1px solid var(--line);border-radius:11px;padding:14px 15px;background:var(--bg2)}
.instfig{flex:none;width:76px;height:76px;color:var(--fg);
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px}
.instbody{min-width:0}
.instname{font-size:15.5px;font-weight:700;margin-bottom:6px}
.instalias{font-size:11.5px;font-weight:400;color:var(--mut);margin-left:8px}
.instrow{font-size:13px;line-height:1.7;margin-top:3px}
.instrow>b:first-child{display:inline-block;min-width:44px;color:var(--acc);font-size:11.5px;
  letter-spacing:.04em;vertical-align:top}
.instrow.mut{color:var(--mut)}
.instrow.mut>b:first-child{color:var(--mut)}

.instcmp{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:12px 0;background:var(--bg2)}
.cmphd{font-size:14px;font-weight:700;margin-bottom:12px}
.cmpbody{display:flex;align-items:center;gap:12px}
.cmpside{flex:1;min-width:0;text-align:center}
.cmpside .instfig{width:96px;height:96px;margin:0 auto 8px}
.cmpname{font-size:13.5px;font-weight:650}
.cmpd{font-size:12.5px;color:var(--mut);line-height:1.65;margin-top:3px}
.cmpvs{flex:none;font-size:12px;color:var(--mut);font-style:italic}
.cmpnote{font-size:12.5px;color:var(--mut);line-height:1.7;margin-top:12px;
  border-top:1px dashed var(--line);padding-top:10px}

@media(max-width:520px){
  .instgrid{grid-template-columns:1fr}
  .instcard{gap:11px;padding:12px 13px}
  .instfig{width:62px;height:62px}
  .cmpside .instfig{width:76px;height:76px}
  .cmpbody{gap:6px}
}
@media print{.instfig{border-color:#999}}

/* ---------- misc ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--bg2);color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--line);padding-left:12px;margin:12px 0}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:30px 0}
.hidden{display:none!important}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;width:min(430px,92vw);height:100vh;background:var(--bg2);
  border-left:1px solid var(--line);box-shadow:-8px 0 40px -12px rgba(0,0,0,.3);
  transform:translateX(100%);transition:transform .25s;z-index:60;overflow-y:auto;padding:20px 22px 60px;
}
.drawer.open{transform:none}
.drawer h3{margin-top:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
.fld{margin:14px 0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.fld select,.fld input[type=text]{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:14px;
}
.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.6}
.menubtn{display:none}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;
  background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:265px;z-index:70;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .main{padding:18px 16px 90px}
  .menubtn{display:inline-block}
  .card{padding:16px 15px}
  .v{grid-template-columns:1fr}
  .v .acts{flex-direction:row}
  .play,.copy{flex:1}
}
@media print{
  .side,.topbar,.drawer,.scrim,.star,.copy{display:none!important}
  .wrap{grid-template-columns:1fr}
  .workbd{display:block!important}
  .theory>summary{display:none}
  .theory{border:none;padding:0}
  body{background:#fff}
}

/* ---------- 樂器軸 ---------- */
.instrow{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;background:var(--bg)}
.instname{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.instweeks{display:flex;gap:4px;flex-wrap:wrap}
.instarc{font-size:13.5px;line-height:1.8;color:var(--mut);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.insttask{font-size:13.5px;line-height:1.8;margin-top:10px}
.insttask>b:first-child{display:block;font-size:11px;letter-spacing:.06em;color:var(--acc);margin-bottom:3px}

/* ---------- 作品背景 / 任務盒 / 版本清單抬頭 ---------- */
.bg{
  font-size:13.5px;line-height:1.85;margin:12px 0;padding:12px 15px;
  background:var(--sel);border-radius:9px;
}
.bg>b:first-child{
  display:block;font-size:11px;letter-spacing:.06em;color:var(--acc);margin-bottom:5px;
}
.taskbox{
  margin:14px 0 10px;padding:12px 15px;border:1.5px solid var(--acc);
  border-radius:9px;background:var(--bg2);
}
.taskbox>b:first-child{
  display:block;font-size:12px;font-weight:700;color:var(--acc);margin-bottom:6px;
}
.taskbox .chk{margin:0}
.taskbox .chk li{font-size:13.5px}
.vhead{font-size:12.5px;color:var(--mut);margin:12px 0 -2px;line-height:1.7}
.vhead b{color:var(--fg)}

/* ---------- 本週入口卡片 ---------- */
.card.thisweek{border:2px solid var(--acc);background:var(--bg2)}
.card.thisweek h2{font-size:20px;margin-bottom:12px}
.tw-work{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg);margin-top:4px}
.tw-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc);margin-bottom:5px}
.tw-work>b{font-size:16px;display:block}
.tw-ver{font-size:13px;color:var(--mut);margin-top:4px}
.tw-work .rowbtns{margin-top:12px;align-items:center}
.tw-work .play{display:inline-block}

/* ---------- 週次前後導覽 ---------- */
.weeknav{display:flex;justify-content:space-between;gap:10px;margin:4px 0 40px}
.weeknav .iconbtn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 搜尋結果 ---------- */
.srow{margin:14px 0 -6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ---------- 手機：主要動作優先、觸控目標放大 ---------- */
@media(max-width:900px){
  /* 原本三顆按鈕等寬、文字擠成三行，主要動作沒有優先性 */
  .v .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .v .acts .play{grid-column:1/-1;font-size:14px;padding:12px 16px;min-height:48px;
    display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .v .acts .copy{min-height:44px;font-size:12.5px;padding:8px 10px}
  .navitem{min-height:44px}
  .wlink{min-height:36px;padding:7px 12px;display:inline-flex;align-items:center}
  .star{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0;margin:-6px 0 -6px -6px}
  .chk input{width:22px;height:22px;margin-top:3px}
  .chk li>label{padding:4px 0}
  .topbar .iconbtn{min-width:44px}
  .iconbtn{min-height:44px}
  /* topbar 原本會換行成兩列，永久佔掉約 50px 的 sticky 空間 */
  .topbar{flex-wrap:nowrap;gap:6px}
  .search{min-width:0;padding:9px 12px}
  .topbar .iconbtn{padding:9px 11px;min-height:42px}
  .topbar .iconbtn .lbl{display:none}
  .weeknav{flex-direction:column}
  .weeknav .iconbtn{max-width:none;min-height:44px}
}
@media(max-width:640px){
  /* min-width:400px 在 390px 螢幕上會把欄位擠到剩幾十像素，連 "Thomas"
     都被硬斷成兩行。寧可讓表格明確地寬一點、明確地要求橫向捲動。 */
  table{min-width:620px}
  .tw td,.tw th{padding-left:10px;padding-right:10px}
}

      if (c && c.works[id]) return { work: c.works[id], course: c };
    }
    return null;
  }
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); };

  /* ---------------- 設定與狀態（localStorage） ---------------- */
  var LS = "cmc.v1";
  var DEFAULTS = {
    region: "tw", lang: "tc",
    hiresFirst: true, hideHistoric: false, theme: "auto",
    // 主要播放平台："kkbox" 或 "youtube"。兩個按鈕永遠都在，這裡只決定
    // 哪一個排在前面、用實心樣式。沒有 KKBOX 的人可以改成 youtube。
    platform: "kkbox",
    done: {}, tasks: {}, checks: {}, fav: {},
    // 使用者手動改過哪些設定。改過的就不再被「切換課程時套用該課預設」覆蓋。
    touched: {},
    // 每週的概念區塊是否收起（{ 週次: false } = 已收起）。預設展開，
    // 因為第一次讀概念是課程設計的一部分；重聽時可自行收起。
    theory: {},
    // 使用者從 KKBOX App「分享 → 複製連結」貼回來的正式網址，key = 搜尋字串。
    // 這種連結帶有專輯／歌曲 ID，手機上點擊會由 Universal Link 直接開啟 App。
    links: {}
  };
  var S = load();
  function load() {
    try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(LS) || "{}")); }
    catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

  /* ---------------- KKBOX 連結 ---------------- */
  /* 搜尋網址格式經使用者實測確認：/{region}/{lang}/search?q={關鍵字}
     曾測試並排除：/search/all/{q}/1（404）、/search?word={q}（關鍵字傳不進去）。
     若 KKBOX 日後改版導致連結失效，只需改這一個函式。 */
  function searchUrl(q) {
    return "https://www.kkbox.com/" + S.region + "/" + S.lang + "/search?q=" + encodeURIComponent(q);
  }

  /* 連結解析順序：本機釘選 → 內建（data-links.js，隨網站部署，跨裝置共用）→ 搜尋連結。
     localStorage 綁定單一裝置＋單一瀏覽器，所以電腦上釘的連結手機看不到；
     要跨裝置共用必須放進 data-links.js。 */
  var REPO = window.PINNED || {};
  function pinnedUrl(q) { return S.links[q] || REPO[q] || null; }
  function pinned(q) { return S.links[q] ? "local" : (REPO[q] ? "repo" : false); }
  function kk(q) { return pinnedUrl(q) || searchUrl(q); }

  /* ---------------- YouTube 連結 ----------------
     沒有 KKBOX 的人原本完全用不了這個網站。YouTube 不需要帳號、不需要訂閱，
     而且古典音樂的完整錄音在上面覆蓋率相當高——尤其是 KKBOX 沒有的歷史錄音。
     用搜尋連結而非影片 ID：影片會被下架、會被版權封鎖，搜尋頁不會失效。
     手機上點擊會由 Universal Link 直接開啟 YouTube App。 */
  function ytUrl(q) {
    return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
  }

  /* 兩個平台的播放按鈕。主要平台排在前面並使用實心樣式，次要的用外框樣式。
     哪個是主要由 S.platform 決定（設定裡可切換），預設 KKBOX。 */
  function playLinksHTML(q, opts) {
    opts = opts || {};
    var pin = pinned(q);
    var kkLabel = opts.short ? (pin ? "▶ KKBOX App" : "KKBOX")
                             : (pin ? "▶ 開啟 KKBOX App" : "在 KKBOX 開啟");
    var ytLabel = opts.short ? "YouTube" : "在 YouTube 開啟";
    var yt = S.platform === "youtube";
    // .alt = 次要平台，用外框樣式。不包 wrapper 元素，否則會打斷外層的 flex／grid。
    var kkBtn = '<a class="play kkbox' + (yt ? " alt" : "") + '" data-q="' + esc(q) + '" href="' + esc(kk(q)) +
      '" target="_blank" rel="noopener">' + kkLabel + "</a>";
    var ytBtn = '<a class="play yt' + (yt ? "" : " alt") + '" data-q="' + esc(q) + '" href="' + esc(ytUrl(q)) +
      '" target="_blank" rel="noopener">▶ ' + ytLabel + "</a>";
    return yt ? ytBtn + kkBtn : kkBtn + ytBtn;
  }

  // 只接受看起來像 KKBOX 曲目／專輯／歌單的網址，避免把搜尋頁本身存進來
  function parseKKLink(raw) {
    var s = (raw || "").trim();
    if (!s) return null;
    var m = s.match(/https?:\/\/[^\s"']+/);
    if (!m) return null;
    var u = m[0].replace(/[)\]},.;]+$/, "");
    if (!/^https?:\/\/([a-z0-9-]+\.)*(kkbox\.com|kkbox\.fm)(\/|$)/i.test(u)) return { err: "這不是 KKBOX 的連結" };
    if (/\/search(\/|\?|$)/i.test(u)) return { err: "這是搜尋頁連結，沒有帶曲目 ID。請改用 App 裡專輯或歌曲頁的「分享 → 複製連結」" };
    return { url: u };
  }

  /* ---------------- 小工具 ---------------- */
  function setFavCount() {
    $("#favBtn").innerHTML = '★<span class="lbl"> 重聽區</span> (' + Object.keys(S.fav).length + ")";
  }

  var toastT;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1800);
  }
  function copyText(txt, btn) {
    var done = function () {
      if (btn) { var o = btn.textContent; btn.textContent = "已複製"; btn.classList.add("ok");
        setTimeout(function () { btn.textContent = o; btn.classList.remove("ok"); }, 1400); }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(done, function () { fallback(txt, done); });
    } else fallback(txt, done);
  }
  function download(obj, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }));
    a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function fallback(txt, cb) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); cb(); } catch (e) { toast("複製失敗，請手動選取"); }
    document.body.removeChild(ta);
  }
  function tierTags(str) {
    if (!str) return "";
    return String(str).split("").map(function (c) { return '<span class="tier ' + c + '" title="' + esc(CORE.tiers[c] ? CORE.tiers[c].name + "：" + CORE.tiers[c].desc : "") + '">' + c + "</span>"; }).join("");
  }
  var TAGNAME = { ref: "公認代表版", period: "古樂器", modern: "現代樂器", entry: "入門友善", narrated: "附旁白" };

  /* ---------------- 版本排序 / 過濾 ---------------- */
  var QORDER = { hires: 0, hifi: 1, historic: 2 };
  function sortVersions(vs) {
    var arr = vs.slice();
    if (S.hiresFirst) {
      arr.sort(function (a, b) {
        var d = QORDER[a.qa] - QORDER[b.qa];
        if (d) return d;
        var ar = a.t && a.t.indexOf("ref") > -1 ? 0 : 1, br = b.t && b.t.indexOf("ref") > -1 ? 0 : 1;
        return ar - br;
      });
    }
    if (S.hideHistoric) arr = arr.filter(function (v) { return v.qa !== "historic"; });
    return arr;
  }

  /* ---------------- 渲染：版本 ---------------- */
  function versionHTML(v) {
    var q = CORE.quality[v.qa];
    var tags = (v.t || []).map(function (t) { return '<span class="tag">' + esc(TAGNAME[t] || t) + "</span>"; }).join("");
    var pin = pinned(v.q);
    var pinLabel = pin === "local"
      ? '<span class="tag pinTag" title="本機釘選——只存在這台裝置的瀏覽器，其他裝置看不到">🔗 本機</span>'
      : pin === "repo"
        ? '<span class="tag pinTag repo" title="內建連結——隨網站部署，所有裝置都有">🔗 內建</span>' : "";
    /* 搜尋字串與「複製／貼上釘選連結」是進階功能，一般使用者只會點播放。
       原本每個版本都攤開來，光是搜尋字串那一列全站就佔掉大量篇幅——降級到 ⋯ 裡。 */
    return '<li class="v ' + v.qa + (pin ? " pinned" : "") + '">' +
      "<div>" +
        '<div class="p">' + esc(v.p) + " " + pinLabel + "</div>" +
        '<div class="sub"><span class="qbadge ' + v.qa + '" title="' + esc(q.desc) + '">' + esc(q.label) + "</span>" +
          esc(v.l) + (v.y ? " · " + v.y : "") + " " + tags + "</div>" +
        (v.w ? '<div class="why">' + esc(v.w) + "</div>" : "") +
        '<details class="vmore"><summary>⋯ 搜尋字串與釘選</summary>' +
          '<div class="qline' + (pin ? " muted" : "") + '">' +
            (pin ? "🔗 KKBOX 直接開啟已釘選連結，不經過搜尋　｜　搜尋字串：" : "🔍 ") +
            "<code>" + esc(v.q) + "</code></div>" +
          '<div class="rowbtns">' +
            '<button class="copy" data-copy="' + esc(v.q) + '">複製搜尋字串</button>' +
            '<button class="copy" data-pin="' + esc(v.q) + '">' + (pin === "local" ? "換／清除連結" : "🔗 貼上分享連結") + "</button>" +
          "</div></details>" +
      "</div>" +
      '<div class="acts">' + playLinksHTML(v.q) + "</div></li>";
  }

  /* ---------------- 渲染：曲目 ---------------- */
  /* 曲目卡片。實測展開一首曲目原本有 947 字、16 個按鈕，其中最重要的聆聽任務
     只佔 11%，而「其他三個版本的詳細資料」佔 57%。改為：
       一律可見＝曲名、首選版本、兩個播放鈕
       點開才有＝本週任務、作品背景、其他版本、對照表
     不做全站「精簡／完整」模式——每個區塊各自點開，沒有模式狀態要記。 */
  function foldHTML(cls, summary, body, opts) {
    if (!body) return "";
    opts = opts || {};
    return '<details class="fold ' + cls + '"' + (opts.open ? " open" : "") + ">" +
      "<summary>" + summary + "</summary><div class=\"foldbd\">" + body + "</div></details>";
  }

  function workHTML(id, wk) {
    var w = WORKS[id];
    if (!w) return '<div class="work"><div class="workhd"><button class="ttl" aria-expanded="false"><b>（缺少資料：' + esc(id) + "）</b></button></div></div>";
    var vs = sortVersions(w.versions || []);
    var top = vs[0], rest = vs.slice(1);
    var fav = !!S.fav[id];

    var metas = [];
    if (w.texture) metas.push("<b>對應織體：</b>" + esc(w.texture));
    if (w.form) metas.push("<b>對應曲式：</b>" + esc(w.form));
    if (w.key) metas.push("<b>重點：</b>" + esc(w.key));
    if (w.country) metas.push("<b>國別：</b>" + esc(w.country));
    if (w.line) metas.push("<b>路線：</b>" + esc(w.line));
    if (w.diff) metas.push("<b>難度：</b>" + esc(w.diff));
    if (w.period) metas.push("<b>分期：</b>" + esc(w.period));

    // 背景層：作品背景、史實註記、生活關聯、編者建議、meta 標籤全部收在一起
    var bgBody =
      (w.bg ? '<div class="bg"><b>作品背景</b>' + tierTags("史析") + w.bg + "</div>" : "") +
      (w.fact ? '<div class="meta">' + tierTags("史") + esc(w.fact) + "</div>" : "") +
      (w.life ? '<div class="life"><b>你可能在哪裡聽過</b>' + w.life + "</div>" : "") +
      (w.pick ? '<div class="meta">' + tierTags("選") + w.pick + "</div>" : "") +
      (w.note ? '<div class="meta">' + esc(w.note) + "</div>" : "") +
      (metas.length ? '<div class="meta">' + metas.join(" ｜ ") + "</div>" : "");

    // 任務層：摺疊列上直接顯示「還有幾項沒做」，不展開也看得到狀態
    var tk = taskStatus(id, wk);
    var taskFold = tk
      ? foldHTML("f-task" + (tk.left ? "" : " done"),
          (tk.left ? "▸ <b>本週任務</b>　還有 " + tk.left + " 項" : "✓ <b>本週任務</b>　已完成"),
          taskBoxHTML(id, wk))
      : "";

    var restBody = rest.length
      ? '<div class="hint" style="margin-bottom:8px">都是<b>同一首曲子的不同演出</b>，選一個聽就好。</div>' +
        '<ul class="vlist">' + rest.map(versionHTML).join("") + "</ul>" +
        '<div class="rowbtns"><button class="iconbtn" data-copy="' + esc(w.q) + '">都找不到？複製通用搜尋字串</button></div>'
      : '<div class="rowbtns"><button class="iconbtn" data-copy="' + esc(w.q) + '">都找不到？複製通用搜尋字串</button></div>';

    return '<div class="work" data-work="' + esc(id) + '" data-search="' +
        esc((w.title + " " + (w.en || "") + " " + w.composer + " " + w.q + " " + (w.versions || []).map(function (v) { return v.p; }).join(" ")).toLowerCase()) + '">' +
      '<div class="workhd">' +
        '<button class="star' + (fav ? " on" : "") + '" data-fav="' + esc(id) + '" title="加入／移出重聽區">' + (fav ? "★" : "☆") + "</button>" +
        /* .ttl 必須是 button：原本的 <div> 無法聚焦，鍵盤使用者根本展不開曲目。
           不把整個 .workhd 變成 button，否則會嵌套 .star。 */
        '<button class="ttl" aria-expanded="false"><b>' + esc(w.title) + "</b><em>" + esc(w.en || "") + " · " + esc(w.composer) + "</em></button>" +
        '<span class="chev">▶</span>' +
      "</div>" +
      '<div class="workbd">' +
        (top ? '<ul class="vlist top">' + versionHTML(top) + "</ul>" : "") +
        taskFold +
        foldHTML("f-bg", "▸ <b>作品背景</b>", bgBody) +
        foldHTML("f-ver", "▸ <b>其他 " + rest.length + " 個版本</b>" +
          (S.hiresFirst && rest.length ? '<span class="hint">上面那個是建議首選</span>' : ""), restBody) +
        (w.answer ? answerHTML(w.answer) : "") +
      "</div></div>";
  }

  /* 這首曲目在本週有幾項任務、還剩幾項沒勾。給摺疊列顯示狀態用。 */
  function taskStatus(workId, wk) {
    if (!wk || !wk.tw) return null;
    var hits = [];
    wk.tw.forEach(function (ids, i) { if (ids.indexOf(workId) > -1) hits.push(i); });
    if (!hits.length) return null;
    var left = hits.filter(function (i) { return !S.tasks[ck(wk.n) + ":" + i]; }).length;
    return { total: hits.length, left: left };
  }

  /* 對照表（答案）。第 1 週的任務要求「不看曲目說明作答，聽完後對照計算正確率」，
     但這份對照表原本站上根本沒有——任務等於做不完。
     預設收起：先看到答案就沒有練習效果了。 */
  function answerHTML(a) {
    if (!a) return "";
    function block(x) {
      return (x.sub ? "<h4>" + esc(x.sub) + "</h4>" : "") +
        (x.intro ? '<div class="hint" style="margin:10px 0">' + x.intro + "</div>" : "") +
        (x.rows ? tableHTML({ head: x.head, rows: x.rows }) : "") +
        (x.text ? "<p>" + x.text + "</p>" : "") +
        (x.note ? '<div class="note">' + x.note + "</div>" : "");
    }
    return '<details class="fold ans"><summary>' + (a.label || "🔒 <b>對照表（答案）</b>") +
      '<span class="hint">' + (a.hint || "聽完再打開") + '</span></summary><div class="foldbd">' +
      (a.parts ? a.parts.map(block).join("") : block(a)) + "</div></details>";
  }

  /* 把本週指派給這首曲目的聆聽任務，直接放在播放按鈕正上方。
     原本任務統一放在週的最下方，使用者往往點了 KKBOX 就離開，
     根本沒看到「這次要聽什麼」——那等於架空了本課程的核心方法。 */
  function taskBoxHTML(workId, wk) {
    if (!wk || !wk.tw) return "";
    var hits = [];
    wk.tw.forEach(function (ids, i) { if (ids.indexOf(workId) > -1) hits.push(i); });
    if (!hits.length) return "";
    return '<ul class="chk">' +
      hits.map(function (i) {
        var k = ck(wk.n) + ":" + i, on = !!S.tasks[k];
        return '<li class="' + (i === 0 ? "must " : "") + (on ? "dn" : "") + '">' +
          '<label><input type="checkbox" data-task="' + k + '"' + (on ? " checked" : "") + ">" +
          "<span>" + wk.tasks[i] + "</span></label></li>";
      }).join("") + "</ul>";
  }

  /* 任務摺疊列上顯示「還有幾項」，勾選後即時更新——不展開也看得到狀態。
     直接數 DOM 裡的 checkbox，不必回查資料。 */
  function refreshTaskFolds() {
    $$("details.f-task").forEach(function (d) {
      var boxes = $$("input[data-task]", d);
      var left = boxes.filter(function (x) { return !x.checked; }).length;
      var sum = d.querySelector("summary");
      if (sum) sum.innerHTML = left
        ? "▸ <b>本週任務</b>　還有 " + left + " 項"
        : "✓ <b>本週任務</b>　已完成";
      d.classList.toggle("done", !left);
    });
  }

  /* ---------------- 渲染：週 ---------------- */
  function tableHTML(t) {
    return '<div class="tw"><table><thead><tr>' + t.head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
      "</tr></thead><tbody>" + t.rows.map(function (r) {
        return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  /* 表格在窄螢幕一定被切掉，但原本看不出來還有內容——像是資料漏了。
     實際量到溢出時才掛上 .scrollable 並補一行提示；桌機夠寬時兩者都不出現。
     提示由 JS 補而非寫進 HTML，因為地理軸、時期概覽等表格是各自手工組的。 */
  function markScrollables() {
    $$(".tw").forEach(function (el) {
      var over = el.scrollWidth > el.clientWidth + 2;
      el.classList.toggle("scrollable", over);
      // 提示放在表格「上方」——放下面的話，還沒捲到底就看不到了
      var hint = el.previousElementSibling;
      var has = hint && hint.classList.contains("twhint");
      if (over && !has) {
        hint = document.createElement("div");
        hint.className = "twhint";
        hint.textContent = "← 表格可左右滑動 →";
        el.parentNode.insertBefore(hint, el);
      } else if (!over && has) {
        hint.parentNode.removeChild(hint);
      }
    });
  }
  var rzT;
  window.addEventListener("resize", function () {
    clearTimeout(rzT); rzT = setTimeout(markScrollables, 150);
  });

  function weekHTML(wk) {
    var mod = CORE.modules.filter(function (m) { return m.id === wk.m; })[0];
    var h = "";
    h += '<div class="card" id="week-' + wk.n + '">';
    h += '<div class="eyebrow">' + esc(mod.label) + " · " + esc(mod.title) + "</div>";
    h += "<h2>第 " + wk.n + " " + COURSE.unitWord + "｜" + esc(wk.title) + (wk.flag ? '<span class="flag">' + esc(wk.flag) + "</span>" : "") + "</h2>";
    h += '<div class="enttl">' + esc(wk.en || "") + "</div>";

    /* 概念與背景放進可摺疊區。課程要求每首曲目重複聽 4–6 次，同一週會回訪多次，
       概念只在第一次要讀；不摺疊的話每次都得滑過最多 1,365px 才看到播放鈕。
       用原生 <details> 而非自製摺疊，因為 <summary> 本身就可聚焦、可用 Enter/Space 開合。 */
    var thy = "";
    // 時期概覽（模組首週）
    if (mod.period && mod.weeks[0] === wk.n) thy += periodHTML(CORE.periods[mod.period]);
    if (mod.goal && mod.weeks[0] === wk.n) thy += '<div class="banner"><b>本模組目標：</b>' + esc(mod.goal) + "</div>";
    if (wk.banner) thy += '<div class="banner">' + wk.banner + "</div>";

    if (wk.concept && wk.concept.length) {
      thy += "<h3>本" + COURSE.unitWord + "核心概念</h3>";

  /* 資料驅動的參考頁渲染器。blocks 可巢狀，讓長篇說明能收進摺疊列。 */
  function blocksHTML(arr) {
    var h = "";
    (arr || []).forEach(function (b) {
      if (b.h3) h += "<h3>" + b.h3 + (b.tier ? " " + tierTags(b.tier) : "") + "</h3>";

      if (b.banner) h += '<div class="banner">' + b.banner + "</div>";
      if (b.note) h += '<div class="note">' + b.note + "</div>";
      if (b.ul) h += "<ul>" + b.ul.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>";
      if (b.ol) h += "<ol>" + b.ol.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ol>";
      if (b.table) h += tableHTML(b.table);
      if (b.instcards) h += instCardsHTML();
      if (b.instcompare) h += instCompareHTML();
      if (b.works) h += b.works.map(function (id) { return workHTML(id, null); }).join("");
      if (b.picks) {
        h += '<ul class="vlist">' + b.picks.map(function (k) {
          return '<li class="v ' + (k.qa || "hifi") + '"><div><div class="p">' + k.label + "</div>" +
            (k.sub ? '<div class="sub">' + k.sub + "</div>" : "") +
            '<details class="vmore"><summary>⋯ 搜尋字串</summary>' +

      // 長篇說明收成摺疊列——參考頁原本是一整面文字牆，掃不動
      if (b.folds) h += b.folds.map(function (f) {
        return foldHTML("f-page", "▸ <b>" + esc(f.t) + "</b>" +
          (f.sub ? '<span class="hint">' + f.sub + "</span>" : ""), blocksHTML(f.blocks));

    return h;

  /* ---------------- 檢視與路由 ----------------
     原本 24 週全部渲染在同一份文件裡，實測桌機 44.5 個螢幕高、手機 70.8 個，
     DOM 8944 個節點。一門要用 6 個月、每週只需要一週內容的課程不該這樣。
     改為一次只渲染當前檢視，並以 URL hash 作為單一真實來源——
     因此瀏覽器上一頁／下一頁自動可用，單一週次也能加書籤。 */
  var CLASSICAL_PAGES = {
    home: homeHTML,
    "p-hires": pHiresHTML,
    "p-method": pMethodHTML,
    "p-kkbox": pKkboxHTML,
    "p-geo": geographyHTML,
    "p-inst": instrumentsHTML,
    "p-tiers": pTiersHTML,
    "p-glossary": pGlossaryHTML,
    "p-caveats": pCaveatsHTML
  };
  /* 台灣傳統音樂課程的參考頁面寫在資料檔裡（course.pages），由 pageHTML() 統一渲染，
     不必為每一頁各寫一個函式。 */
  /* 兩門課都可以混用「函式頁」與「資料頁」：古典課既有的頁面是函式，
     新加的樂器圖鑑是資料頁，共用 pageHTML() 渲染。 */
  function pagesFor(c) {
    var m = c.id === "classical"
      ? Object.assign({}, CLASSICAL_PAGES)
      : { home: function () { return homeHTML(); } };
    (c.pages || []).forEach(function (pg) {
      m[pg.id] = function () { return pageHTML(pg); };
    });
    return m;
  }
  function PAGE(v) { return pagesFor(COURSE)[v]; }

  var view = "home";
  var searchReturn = "home"; // 清空搜尋時要回到哪個檢視

  /* hash 格式：[課程/]檢視。省略課程＝古典音樂，所以既有的 #week-5 書籤照舊有效；
     台灣傳統音樂為 #taiwan/unit-3。兩者都可寫成完整形式 #classical/week-5。 */
  function parseHash() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var course = "classical", rest = h;
    // 課程前綴可帶或不帶斜線：#taiwan 與 #taiwan/ 與 #taiwan/unit-3 都要能用
    var m = h.match(/^([a-z]+)(?:\/(.*))?$/);
    if (m && COURSES[m[1]]) { course = m[1]; rest = m[2] || ""; }
    return { course: course, view: rest };
  }

  function viewFromHash() {
    var pr = parseHash();
    if (pr.course !== COURSE.id) useCourse(pr.course);
    var h = pr.view, c = COURSE;
    if (!h) return "home";
    if (h === "all") return "all";
    if (PAGE(h)) return h;
    var m = h.match(/^(?:week|unit)-(\d+)$/);
    if (m && WEEKS.some(function (w) { return w.n === +m[1]; })) return unitView(+m[1]);
    return "home"; // 未知的 hash（例如舊書籤）落回首頁，不留白畫面
  }

  // 古典課用 week-N，台灣課用 unit-N，讓網址讀起來符合該課程的用語
  function unitSlug() { return COURSE.id === "classical" ? "week" : "unit"; }
  function unitView(n) { return unitSlug() + "-" + n; }
  function unitNum(v) { var m = v.match(/^(?:week|unit)-(\d+)$/); return m ? +m[1] : null; }

  function hashFor(v, courseId) {
    var cid = courseId || COURSE.id;
    var prefix = cid === "classical" ? "" : cid + "/";
    return (v === "home" && !prefix) ? "" : "#" + prefix + (v === "home" ? "" : v);
  }

  function setView(v, opts) {
    opts = opts || {};
    view = v;
    if (!opts.fromHash) {
      var target = hashFor(v);
      if (location.hash !== target) {
        if (target) location.hash = target.slice(1);
        else history.replaceState(null, "", location.pathname + location.search);
      }
    }
    render();
    if (!opts.keepScroll) window.scrollTo(0, 0);
    $("#side").classList.remove("open");
  }

  // 切換課程：跳到該課程首頁，並套用該課程的預設（例如台灣課預設 YouTube 優先）
  function switchCourse(id) {
    if (!COURSES[id] || id === COURSE.id) return;
    useCourse(id);
    applyCourseDefaults();
    if ($("#q").value) $("#q").value = "";
    location.hash = hashFor("home", id).slice(1) || " ";
    if (!location.hash || location.hash === "# ") {
      history.replaceState(null, "", location.pathname + location.search);
    }
    view = "home"; render(); window.scrollTo(0, 0);
    $("#side").classList.remove("open");
    setBrand();
  }

  /* 每門課的合理預設不同，但使用者改過的就不再覆蓋（記在 S.touched）。
     台灣傳統音樂在 KKBOX 上曲庫很薄，YouTube 才是主力；而且這門課最重要的錄音
     常常是 1943／1971 年的歷史錄音，「Hi-Res 優先」在這裡是錯的預設。 */
  function applyCourseDefaults() {
    var d = COURSE.defaults || {};
    var changed = false;
    Object.keys(d).forEach(function (k) {
      if (!S.touched[k] && S[k] !== d[k]) { S[k] = d[k]; changed = true; }
    });
    if (changed) save();
  }

  function setBrand() {
    var el = $(".brand");
    if (el) el.innerHTML = esc(COURSE.brand) + "<small>" + esc(COURSE.brandSub) + "</small>";
  }

  function weekNavHTML(n) {
    var u = COURSE.unitWord;

    var next = WEEKS.filter(function (w) { return w.n === n + 1; })[0];
    return '<div class="weeknav">' +

      (next ? '<button class="iconbtn" data-go="' + unitView(next.n) + '">第 ' + next.n + " " + u + "　" + esc(next.title) + " →</button>" : "<span></span>") +
      "</div>";
  }

  /* ---------------- 主渲染 ---------------- */
  function render() {
    $("#nav").innerHTML = navHTML();
    var body;
    if (view === "search") {
      body = searchHTML();
    } else if (view === "all") {
      var pages = pagesFor(COURSE);
      var dp = (COURSE.pages || []).map(function (pg) { return pageHTML(pg); }).join("");
      var extras = COURSE.id === "classical"
        ? [homeHTML(), dp, geographyHTML(), instrumentsHTML(), pHiresHTML(), pMethodHTML(), pKkboxHTML()].join("")
        : homeHTML() + dp;
      var tail = COURSE.id === "classical" ? pTiersHTML() + pGlossaryHTML() + pCaveatsHTML() : "";
      body = '<div class="banner" style="margin-bottom:16px"><b>顯示全部</b>：整門課程在同一頁，適合一路瀏覽或列印。' +
        "要回到單" + COURSE.unitWord + "檢視，點左側任一" + COURSE.unitWord + "次即可。</div>" +
        extras + WEEKS.map(weekHTML).join("") + tail;
    } else if (unitNum(view) !== null) {
      var n = unitNum(view);
      var wk = WEEKS.filter(function (w) { return w.n === n; })[0];
      body = weekHTML(wk) + weekNavHTML(n);
    } else {
      body = (PAGE(view) || homeHTML)();
    }
    $("#content").innerHTML = body + FOOT();
    updateProgress();
    $$(".navitem").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-go") === view);
    });
    markScrollables();
  }

  /* ---------------- 搜尋 ----------------
     原本是對已渲染的 DOM 加 .hidden，單週檢視下 DOM 只有一週，那種做法會失效。
     改為對資料本身搜尋並產生結果檢視——順便解決了原本「找到了卻不知道在第幾週」
     的問題：每個結果都標明所屬週次，可直接跳過去。 */

  // 每首曲目出現在哪幾週（同一首可能跨週複用，例如 mozart-40 在第 4、8 週）
  var WORK_WEEKS = {};
  function buildWorkWeeks() {
    var map = {};
    WEEKS.forEach(function (w) {
      [].concat(w.works || [], w.extraWorks || []).forEach(function (id) {
        (map[id] = map[id] || []).push(w.n);
      });
    });
    // 資料頁（course.pages）裡直接嵌入的曲目也要能被搜尋定位
    (COURSE.pages || []).forEach(function (pg) {
      (pg.blocks || []).forEach(function (b) {
        (b.works || []).forEach(function (id) { if (!map[id]) map[id] = []; });
      });
    });
    WORK_WEEKS = map;
  }

  function searchIndex(id) {
    var w = WORKS[id];
    return [w.title, w.en, w.composer, w.q, w.bg, w.fact, w.life, w.pick,
            (w.versions || []).map(function (v) { return v.p + " " + v.l + " " + v.q; }).join(" ")]
      .filter(Boolean).join(" ").toLowerCase();
  }

  function runSearch(q) {
    q = q.trim().toLowerCase();
    var works = Object.keys(WORKS)
      .filter(function (id) { return searchIndex(id).indexOf(q) > -1; })
      .sort(function (a, b) { return (WORK_WEEKS[a] || [99])[0] - (WORK_WEEKS[b] || [99])[0]; });
    var weeks = WEEKS.filter(function (w) {
      var t = (w.title + " " + (w.en || "") + " " +
        (w.concept || []).map(function (c) { return c.t; }).join(" ")).toLowerCase();
      return t.indexOf(q) > -1;
    });
    return { works: works, weeks: weeks };
  }

  // 另一門課裡有沒有命中？搜尋是最容易撞見跨課程關聯的地方，不該讓它靜默。
  function otherHits(q) {
    var res = [];
    courseList().forEach(function (cid) {
      if (cid === COURSE.id) return;
      var c = COURSES[cid], lq = q.trim().toLowerCase(), n = 0;
      Object.keys(c.works).forEach(function (id) {
        var w = c.works[id];
        var t = [w.title, w.en, w.composer, w.q, w.bg, w.fact, w.life, w.pick,
                 (w.versions || []).map(function (v) { return v.p + " " + v.l + " " + v.q; }).join(" ")]
          .filter(Boolean).join(" ").toLowerCase();
        if (t.indexOf(lq) > -1) n++;
      });
      if (n) res.push({ course: c, n: n });
    });
    return res;
  }

  function searchHTML() {
    var q = ($("#q").value || "").trim();
    var r = runSearch(q), u = COURSE.unitWord;
    var h = '<div class="card"><h2>在「' + esc(COURSE.label) + "」中搜尋「" + esc(q) + "」</h2>" +
      '<div class="enttl">曲目 ' + r.works.length + " 首　·　" + u + "次 " + r.weeks.length + " 個</div>";
    var other = otherHits(q);
    if (!r.works.length && !r.weeks.length) {
      h += '<p class="hint">這門課裡沒有符合的結果。試試作曲家或演奏者姓名、樂種名稱（南管、歌仔戲）、' +
        "或中文曲名關鍵字。</p>";
    }
    if (other.length) {
      h += '<div class="banner" style="margin-top:12px"><b>另一門課有結果：</b>' +
        other.map(function (o) {
          return '<button class="iconbtn on" data-course="' + o.course.id + '" style="margin-left:6px">' +
            o.course.icon + " " + esc(o.course.label) + "　" + o.n + " 首 →</button>";
        }).join("") +
        '<div class="hint" style="margin-top:8px">切過去之後再搜一次同一個關鍵字即可。</div></div>';
    }
    if (r.weeks.length) {
      h += "<h3>" + u + "次</h3><div class=\"rowbtns\">" + r.weeks.map(function (w) {
        return '<button class="iconbtn" data-go="' + unitView(w.n) + '">第 ' + w.n + " " + u + "　" + esc(w.title) + "</button>";
      }).join("") + "</div>";
    }
    h += "</div>";
    if (r.works.length) {
      h += '<div class="card"><h2>曲目</h2>';
      h += r.works.map(function (id) {
        var wks = WORK_WEEKS[id] || [];
        var wk = WEEKS.filter(function (w) { return w.n === wks[0]; })[0];
        return '<div class="srow">' + (wks.length
          ? wks.map(function (n) { return '<button class="wlink" data-go="' + unitView(n) + '">第 ' + n + " " + u + "</button>"; }).join(" ")
          : '<span class="hint">延伸曲目</span>') + "</div>" + workHTML(id, wk);
      }).join("");
      h += "</div>";
    }
    return h;
  }

  var searchT;   // 輸入防抖，避免每敲一個字就重繪整個結果頁
  function onSearchInput() {
    clearTimeout(searchT);
    searchT = setTimeout(function () {
      var q = ($("#q").value || "").trim();
      if (!q) {
        if (view === "search") setView(searchReturn);
        return;
      }
      if (view !== "search") searchReturn = view;
      view = "search";
      render();
      window.scrollTo(0, 0);
    }, 160);
  }

  /* ---------------- 重聽區 ---------------- */
  /* ★ 重聽區跨課程共用——收藏是「這首打到我」，不該因為換課程就看不到。
     兩門課的曲目分組顯示，各自標明課程。 */
  function favHTML() {
    var ids = Object.keys(S.fav).filter(function (k) { return S.fav[k] && findWork(k); });
    if (!ids.length) return '<p class="hint">還沒有收藏。點任一曲目左邊的 ☆ 就會加進來。<br><br>建議用法：課程進行中凡是聽了有感覺的曲目立即收藏，最後統計哪個時期／樂種／作曲家佔比最高——那就是你的品味起點。<br><br><b>兩門課的收藏會放在一起</b>，所以你可以直接看出自己在古典音樂與台灣傳統音樂之間偏向哪一邊。</p>';
    var h = '<div class="rowbtns"><button class="iconbtn" id="favCopy">複製全部搜尋字串（' + ids.length + " 首）</button>" +
      '<button class="iconbtn" id="favClear">清空</button></div>';
    courseList().forEach(function (cid) {
      var c = COURSES[cid];
      var mine = ids.filter(function (id) { return c.works[id]; });
      if (!mine.length) return;
      h += '<div class="navmod" style="margin-top:18px"><span>' + c.icon + "</span> " +
        esc(c.label) + "　" + mine.length + " 首</div>";
      h += '<ul class="vlist">' + mine.map(function (id) {
        var w = c.works[id], top = sortVersions(w.versions || [])[0];
        return '<li class="v ' + (top ? top.qa : "hifi") + '"><div>' +
          '<div class="p">' + esc(w.title) + "</div>" +
          '<div class="sub">' + esc(w.composer) + (top ? " ｜ 推薦：" + esc(top.p) : "") + "</div></div>" +
          '<div class="acts">' + playLinksHTML(top ? top.q : w.q, { short: true }) +
          '<button class="copy" data-unfav="' + esc(id) + '">移除</button></div></li>';
      }).join("") + "</ul>";
    });
    return h;
  }
  function favText() {
    return Object.keys(S.fav).filter(function (k) { return S.fav[k] && findWork(k); }).map(function (k) {
      var w = findWork(k).work, top = sortVersions(w.versions || [])[0];
      return (top ? top.q : w.q);
    }).join("\n");
  }

  /* ---------------- 主題 ---------------- */
  function applyTheme() {
    var t = S.theme;
    if (t === "auto") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  }

  /* ---------------- 抽屜 ---------------- */
  function openDrawer(which) {
    var d = $("#drawer");
    d.innerHTML = '<button class="iconbtn" id="drawerClose" style="float:right">✕ 關閉</button>' + (which === "fav"
      ? '<h3>★ 重聽區</h3><p class="hint">對應課程 §2.2 建議建立的 <code>古典課程｜重聽區</code> 播放清單。</p>' + favHTML()
      : settingsHTML());
    d.classList.add("open"); $("#scrim").classList.add("on");
    d.setAttribute("data-which", which);
  }
  function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("on"); }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || typeof t.closest !== "function") return;
    var find = function (a) { return t.closest("[" + a + "]"); };

    // 開啟 KKBOX 時順手把關鍵字放進剪貼簿：萬一搜尋頁是空的，直接貼上即可
    var pn = find("data-pin");
    if (pn) {
      var pq = pn.getAttribute("data-pin");
      var cur = S.links[pq] || "";
      var raw = prompt(
        "在 KKBOX App 找到這張專輯 → 分享 → 複製連結 → 貼在這裡。\n" +
        "之後點「開啟 App」就會直接跳到這張專輯。\n\n" +
        "留白並確定＝清除已釘選的連結。\n\n關鍵字：" + pq, cur);
      if (raw === null) return;
      if (!raw.trim()) { delete S.links[pq]; save(); render(); toast("已清除釘選連結"); return; }
      var r = parseKKLink(raw);
      if (!r) { toast("沒有偵測到網址"); return; }
      if (r.err) { toast(r.err); return; }
      S.links[pq] = r.url; save(); render(); toast("已釘選——這一版現在會直接開啟 App");
      return;
    }
    var go = find("data-go");
    if (go) {
      var id = go.getAttribute("data-go");
      if (view === "all") {
        // 顯示全部模式下沿用捲動定位，不切換檢視
        var el = id === "home" ? $("#content").firstElementChild : document.getElementById(id);
        if (el) { el.scrollIntoView({ block: "start" }); $("#side").classList.remove("open"); return; }
      }
      if ($("#q").value) $("#q").value = "";
      setView(id);
      return;
    }
    var cp = find("data-copy");
    if (cp) { copyText(cp.getAttribute("data-copy"), cp.classList.contains("copy") ? cp : null);
      if (!cp.classList.contains("copy")) toast("已複製搜尋字串"); return; }

    var cw = find("data-copyweek");
    if (cw) {
      var n = +cw.getAttribute("data-copyweek");
      var wk = WEEKS.filter(function (w) { return w.n === n; })[0];
      var lines = (wk.works || []).concat(wk.extraWorks || []).map(function (id) {
        var w = WORKS[id]; if (!w) return null;
        var top = sortVersions(w.versions || [])[0];
        return (top ? top.q : w.q);
      }).filter(Boolean);
      copyText(lines.join("\n")); toast("已複製 " + lines.length + " 組搜尋字串"); return;
    }
    var fv = find("data-fav");
    if (fv) {
      var fid = fv.getAttribute("data-fav");
      S.fav[fid] = !S.fav[fid]; if (!S.fav[fid]) delete S.fav[fid];
      save();
      $$('[data-fav="' + fid + '"]').forEach(function (b) {
        b.classList.toggle("on", !!S.fav[fid]); b.textContent = S.fav[fid] ? "★" : "☆"; });
      setFavCount();
      return;
    }
    var uf = find("data-unfav");
    if (uf) { delete S.fav[uf.getAttribute("data-unfav")]; save(); openDrawer("fav");
      setFavCount();
      $$('[data-fav="' + uf.getAttribute("data-unfav") + '"]').forEach(function (b) { b.classList.remove("on"); b.textContent = "☆"; });
      return; }

    var dn = find("data-done");
    if (dn) {
      var wn = dn.getAttribute("data-done");
      S.done[wn] = !S.done[wn]; if (!S.done[wn]) delete S.done[wn];
      save();
      dn.classList.toggle("on", !!S.done[wn]);
      dn.textContent = S.done[wn] ? "✓ 已完成" : "標記" + COURSE.unitWord + "完成";
      var nav = $('.navitem[data-week="' + wn + '"]');
      if (nav) nav.classList.toggle("done", !!S.done[wn]);
      updateProgress();
      return;
    }
    /* 用 closest 而非 t.id：★／⚙ 兩顆按鈕內含 <span class="lbl">，
       點在「重聽區」「設定」這幾個字上時 e.target 會是那個 span，id 為空，
       按鈕就沒反應——只有點到圖示才有用。 */
    if (t.closest("#favBtn") || t.closest("#favBtn2")) { openDrawer("fav"); return; }
    if (t.closest('[data-open="settings"]') || t.closest("#setBtn")) { openDrawer("settings"); return; }
    if (t.id === "scrim" || t.id === "drawerClose") { closeDrawer(); return; }
    if (t.id === "menuBtn") { $("#side").classList.toggle("open"); return; }
    if (t.id === "favCopy") { var txt = favText(); if (txt) { copyText(txt); toast("已複製，可貼進 KKBOX 或 YouTube 逐首搜尋"); } return; }
    if (t.id === "favClear") { if (confirm("清空重聽區？")) { S.fav = {}; save(); render(); openDrawer("fav");
      setFavCount(); } return; }
    if (t.id === "setExport") { download(S, "classical-course-progress.json"); return; }
    if (t.id === "linkExport") {
      if (!Object.keys(S.links).length) { toast("還沒有本機釘選"); return; }
      download(S.links, "kkbox-links.json"); return;
    }
    if (t.id === "linkCopy") {
      var all = Object.assign({}, REPO, S.links);
      if (!Object.keys(all).length) { toast("還沒有任何釘選連結"); return; }
      copyText(JSON.stringify(all, null, 2));
      toast("已複製 " + Object.keys(all).length + " 個連結（本機＋內建）");
      return;
    }
    if (t.id === "linkImport" || t.id === "setImport") {
      var isLinks = t.id === "linkImport";
      var raw = prompt(isLinks
        ? "貼上先前匯出的 kkbox-links.json 內容（會與現有的合併，同名覆蓋）："
        : "貼上先前匯出的 classical-course-progress.json 內容（會覆蓋目前的進度）：", "");
      if (raw === null || !raw.trim()) return;
      var data;
      try { data = JSON.parse(raw); } catch (err) { toast("JSON 格式不正確，沒有匯入"); return; }
      if (!data || typeof data !== "object" || Array.isArray(data)) { toast("內容不是預期的格式"); return; }
      if (isLinks) {
        var n = 0;
        Object.keys(data).forEach(function (k) {
          var r = parseKKLink(data[k]);
          if (r && r.url) { S.links[k] = r.url; n++; }
        });
        save(); render(); openDrawer("settings"); toast("已匯入 " + n + " 個連結");
      } else {
        S = Object.assign({}, DEFAULTS, data);
        save(); applyTheme(); render(); openDrawer("settings");
        setFavCount();
        toast("已匯入進度");
      }
      return;
    }
    if (t.id === "linkClear") {
      if (confirm("清除全部已釘選的 App 連結？（進度與收藏不受影響）")) {
        S.links = {}; save(); render(); openDrawer("settings"); toast("已清除");
      }
      return;
    }
    if (t.id === "setReset") {
      if (confirm("清除全部進度、收藏與設定？此動作無法復原。")) {
        S = Object.assign({}, DEFAULTS, { done: {}, tasks: {}, checks: {}, fav: {} });
        save(); applyTheme(); render(); closeDrawer();
        setFavCount();
      }
      return;
    }
    var cb = t.closest("[data-course]");
    if (cb) { switchCourse(cb.getAttribute("data-course")); return; }
    // 展開曲目
    var hd = t.closest(".workhd");
    if (hd && !t.closest(".star")) {
      var on = hd.parentElement.classList.toggle("open");
      var ttl = hd.querySelector(".ttl");
      if (ttl) ttl.setAttribute("aria-expanded", on ? "true" : "false");
      if (on) markScrollables();
      return;
    }
  });

  /* <details> 的 toggle 不會冒泡，必須用捕獲階段監聽 */
  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (!d.tagName || d.tagName !== "DETAILS") return;
    // 摺疊區裡的表格在收起時量不到寬度，展開後才能判斷是否需要捲動提示
    if (d.open) markScrollables();
    if (!d.hasAttribute("data-theory")) return;
    var n = d.getAttribute("data-theory");
    if (d.open) delete S.theory[n]; else S.theory[n] = false;
    save();
  }, true);

  /* 收起的 <details> 內容不會列印，列印前先全部展開。
     .ans（答案）除外——任務本身就要求準備紙筆，把週次印出來作答時
     不該連答案一起印在同一張紙上。已手動展開的則尊重使用者的選擇。 */
  window.addEventListener("beforeprint", function () {
    $$("details:not(.ans)").forEach(function (d) { d.open = true; });
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute("data-task")) {
      var k = t.getAttribute("data-task");
      S.tasks[k] = t.checked; if (!t.checked) delete S.tasks[k]; save();
      // 同一項任務同時出現在曲目下方與週末總覽，兩處都要同步
      $$('[data-task="' + k + '"]').forEach(function (el) {
        el.checked = t.checked;
        el.closest("li").classList.toggle("dn", t.checked);
      });
      refreshTaskFolds();
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-check")) {
      var k2 = t.getAttribute("data-check");
      S.checks[k2] = t.checked; if (!t.checked) delete S.checks[k2]; save();
      t.closest("li").classList.toggle("dn", t.checked); return;
    }
    var map = { setRegion: "region", setLang: "lang", setTheme: "theme", setPlatform: "platform" };
    if (map[t.id]) {
      S[map[t.id]] = t.value; S.touched[map[t.id]] = true; save();
      if (t.id === "setTheme") applyTheme(); else render();
      // 設定面板本身也含播放連結說明，切換後要一起重畫
      if (t.id === "setPlatform") { openDrawer("settings"); toast("主要平台已切換為 " + (t.value === "youtube" ? "YouTube" : "KKBOX")); }
      return;
    }
    if (t.id === "setHires") { S.hiresFirst = t.checked; S.touched.hiresFirst = true; save(); render(); return; }
    if (t.id === "setHideH") { S.hideHistoric = t.checked; save(); render(); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
  });
  /* 手機上完整的提示文字塞不下，會被 ★ 按鈕蓋住一半，看起來像壞掉。
     Esc 清除本來就只有實體鍵盤用得到，窄螢幕直接拿掉那段。 */
  (function () {
    var el = $("#q"), full = el.getAttribute("placeholder");
    function fit() { el.setAttribute("placeholder", innerWidth < 560 ? "搜尋曲目、作曲家…" : full); }
    fit();
    window.addEventListener("resize", fit);
  })();

  $("#q").addEventListener("input", onSearchInput);
  $("#q").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { this.value = ""; onSearchInput(); }
  });
  window.addEventListener("hashchange", function () {
    var v = viewFromHash();
    if (v !== view) { if ($("#q").value) $("#q").value = ""; setView(v, { fromHash: true }); }
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { if (S.theme === "auto") applyTheme(); });
  }

  // 捲動時同步導覽高亮
  var spyT;
  window.addEventListener("scroll", function () {
    if (view !== "all") return;   // 單週檢視不需要捲動定位，省掉每次捲動的量測迴圈
    clearTimeout(spyT);
    spyT = setTimeout(function () {
      var best = null, bestD = Infinity;
      $$("#content .card").forEach(function (c) {
        if (c.classList.contains("hidden") || !c.id) return;
        var d = Math.abs(c.getBoundingClientRect().top - 90);
        if (d < bestD) { bestD = d; best = c.id; }
      });
      if (!best) return;
      $$(".navitem").forEach(function (n) { n.classList.toggle("active", n.getAttribute("data-go") === best); });
    }, 120);
  }, { passive: true });

  /* ---------------- 啟動 ---------------- */
  useCourse(parseHash().course);
  applyCourseDefaults();
  setBrand();
  applyTheme();
  view = viewFromHash();
  render();
  setFavCount();
})();

</script>
</body>
</html>
